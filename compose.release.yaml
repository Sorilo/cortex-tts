name: cortex-tts-release
services:
  breeze-backend:
    image: ghcr.io/sorilo/cortex-tts-backend@sha256:c8b2411666e60b76665f694f3f8c9d6bcf01a20f845f6dee33a1bbf28cd46a67
    command:
      - /models/breeze-tts-2-q4_k.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ws-port
      - "8081"
      - --voices-dir
      - /voices
      - --chunk-first
      - "${BREEZE_CHUNK_FIRST:-2}"
      - --chunk-max
      - "${BREEZE_CHUNK_MAX:-25}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${BREEZE_GPU_DEVICE:?set GPU UUID or index}"]
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: ${BREEZE_GPU_DEVICE:?set GPU UUID or index}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics,display
    volumes:
      - ${BREEZE_MODEL_DIR:?set BREEZE_MODEL_DIR}:/models:ro
      - ${BREEZE_VOICES_DIR:?set BREEZE_VOICES_DIR}:/voices
    networks: [tts-internal]
    restart: unless-stopped
  wrapper:
    image: ghcr.io/sorilo/cortex-tts-wrapper@sha256:192b16de727635df8ad1b194636df0b0641cb06995306f614816e12dfa9b91d9
    environment:
      BREEZE_HTTP: http://breeze-backend:8080
      BREEZE_WS: ws://breeze-backend:8081
      CORTEX_TTS_TOKEN: ${CORTEX_TTS_TOKEN:?set CORTEX_TTS_TOKEN}
      BREEZE_VOICE: ${BREEZE_VOICE:-}
      BREEZE_INSTRUCTION: ${BREEZE_INSTRUCTION:-Speak clearly and naturally.}
    depends_on: [breeze-backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/readyz', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 5s
    ports:
      - "${CORTEX_TTS_BIND:-127.0.0.1}:${CORTEX_TTS_RELEASE_API_PORT:-18084}:18080"
      - "${CORTEX_TTS_BIND:-127.0.0.1}:${CORTEX_TTS_RELEASE_WYOMING_PORT:-10224}:10200"
    networks: [tts-internal]
    restart: unless-stopped
networks:
  tts-internal: {}
